# Ρυθμίσεις Netlify. Το Astro adapter φτιάχνει μόνο του τις functions για τα /api/*.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Κεφαλίδες ασφαλείας για όλες τις σελίδες
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Τα αρχεία του build έχουν hash στο όνομα, άρα κρατιούνται στην cache για πάντα
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
